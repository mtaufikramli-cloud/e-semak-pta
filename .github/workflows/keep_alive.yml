name: Keep Streamlit Alive

on:
  schedule:
    # Dijalankan setiap 15 minit
    - cron: '*/15 * * * *'
  workflow_dispatch: # Membenarkan pemicu manual dari GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          curl -s https://e-semak-pta.streamlit.app > /dev/null
